site_name: Roomvana API
site_url: https://roomvana-api.readthedocs.io/
site_description: Public API reference for Roomvana — catalogue, image hand-off bridge, deep links and the MCP server.
site_author: Roomvana
repo_url: https://github.com/TJLDC/roomvana-api-docs
repo_name: TJLDC/roomvana-api-docs
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/theme-light-dark
        name: Switch theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/theme-light-dark
        name: Switch theme
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Overview: index.md
  - Catalogue: catalog.md
  - Image hand-off: handoff.md
  - MCP server: mcp.md
  - Deep links: links.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

extra:
  generator: false

copyright: Roomvana — redesign a room from a photo at <a href="https://roomvana.ai">roomvana.ai</a>
